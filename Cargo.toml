[package]
name = "xps2pdf"
version = "0.1.0"
edition = "2021"
description = "把 XPS / OXPS 转成 PDF. Windows 与 macOS 共用同一套纯 Rust 转换, 不依赖系统 XPS 组件."
publish = false

[dependencies]
async-channel = "2"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
miniz_oxide = "0.8"
pdf-writer = "0.13"
rfd = "0.15"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ttf-parser = "0.25"
zip = { version = "2.4", default-features = false, features = ["deflate", "deflate64"] }

[profile.release]
lto = false
codegen-units = 16
opt-level = 3
strip = true
